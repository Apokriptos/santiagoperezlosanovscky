<!doctype html><html lang="en"><meta charset="utf-8"><title>Global polish viewport checks</title><style>body{font:13px monospace}pre{white-space:pre-wrap}iframe{display:block;border:0}</style><pre id="report">Running…</pre><iframe title="Global fit verification"></iframe><script type="module">
import {Projects,Roles,CaseStudies} from '../src/data.js';
const frame=document.querySelector('iframe'),report=document.querySelector('#report'),results=[];
let routes=['#games','#games/projects',...Projects.map(p=>'#games/projects/'+p.id),'#games/roles',...Roles.map(r=>'#games/roles/'+r.id),'#games/case-studies',...CaseStudies.flatMap(c=>['#games/case-studies/'+c.id,...c.steps.map(s=>'#games/case-studies/'+c.id+'/'+s.id)]),'#games/about','#games/cv','#games/contact'];
const quick=new URLSearchParams(location.search).has('quick');if(quick)routes=['#games','#games/projects','#games/roles','#games/about'];
const tick=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));let seq=0;
try{
 for(const [width,height] of (quick?[[1280,720],[1440,900],[1600,900]]:[[1280,720],[1366,768],[1440,900],[1600,900],[1920,1080],[2560,1440]])){
  for(const route of routes){
   frame.width=width;frame.height=height;await new Promise(r=>{frame.onload=r;frame.src='/santiagoperezlosanovscky/?global-fit='+ ++seq+route;});await tick();const d=frame.contentDocument,w=frame.contentWindow;await d.fonts.ready;await tick();
   const issues=[],main=d.querySelector('main'),page=d.querySelector('.page');
   if(!page)throw Error('Page not rendered '+route);
   if(d.documentElement.scrollWidth>width||main.scrollWidth>main.clientWidth)issues.push('horizontal '+d.documentElement.scrollWidth+'/'+main.scrollWidth+'/'+main.clientWidth);
   if(d.documentElement.scrollHeight>height||main.scrollHeight>main.clientHeight)issues.push('vertical '+d.documentElement.scrollHeight+'/'+main.scrollHeight+'/'+main.clientHeight);
   for(const n of d.querySelectorAll('.page h1,.page h2,.page h3,.page h4,.page p,.page li,.page .ui-btn,.page .media,.page .pdf-viewer')){
    if(!n.getClientRects().length||n.closest('[hidden],dialog:not([open])'))continue;
    const b=n.getBoundingClientRect();if(b.width<1||b.height<1)continue;
    if(b.bottom>height+1||b.top<-1)issues.push('outside '+n.className+' '+n.textContent.trim().slice(0,30)+' y='+Math.round(b.top)+'..'+Math.round(b.bottom));
    const panel=n.closest('.ui-surface__body,.print-panel,.destination-card');
    if(panel){const p=panel.getBoundingClientRect();if(b.bottom>p.bottom+2||b.top<p.top-2)issues.push('panel '+n.className+' '+n.textContent.trim().slice(0,30)+' bottom='+Math.round(b.bottom)+'/'+Math.round(p.bottom));}
   }
   const board=d.querySelector('.roles-overview__grid');if(board&&w.getComputedStyle(board).gridTemplateColumns.split(' ').length!==3)issues.push('Roles grid is not 3 columns');
   for(const n of d.querySelectorAll('.about-layout .print-panel,.about-facts > .print-panel')){const parent=n.closest('.about-layout,.about-facts').getBoundingClientRect(),b=n.getBoundingClientRect();if(b.bottom>parent.bottom+2)issues.push('About band overlap '+Math.round(b.bottom)+'/'+Math.round(parent.bottom));}
   results.push({width,height,route,passed:!issues.length,issues:[...new Set(issues)]});
  }
  report.textContent=JSON.stringify({running:true,completedResolution:[width,height],failed:results.filter(r=>!r.passed),checks:results.length},null,2);
 }
 report.textContent=JSON.stringify({passed:results.every(r=>r.passed),results},null,2);
}catch(error){report.textContent=JSON.stringify({passed:false,error:error.message,results},null,2);}
</script></html>
