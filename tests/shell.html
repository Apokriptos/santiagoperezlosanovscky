<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shell geometry fixture</title><link rel="stylesheet" href="../styles/shell.css"><div id="app"></div><script type="module">
import { gamesShell } from '../src/shell.js';
if (location.search.includes('viewport')) {
  window.addEventListener('message', event => { if(event.origin===location.origin) { const out=document.createElement('pre'); out.id='measurements'; out.textContent=JSON.stringify(event.data); document.body.prepend(out); } });
  const frame = document.createElement('iframe'); frame.width='1434'; frame.height='913'; frame.style.border='0';
  frame.src='./shell.html'+(location.search.includes('context') ? '?context' : ''); document.body.append(frame);
} else {
  const context = location.search.includes('context') ? {title:'Right',items:[]} : null;
  document.querySelector('#app').innerHTML=gamesShell({left:'Left',main:'Neutral main content'},context);
  requestAnimationFrame(()=>parent.postMessage({viewport:[innerWidth,innerHeight],columns:[...document.querySelector('.games-shell').children].filter(n=>getComputedStyle(n).display!=='none').map(n=>({class:n.className,width:n.getBoundingClientRect().width,height:n.getBoundingClientRect().height})),overflow:document.documentElement.scrollWidth>innerWidth},location.origin));
}
</script></html>
