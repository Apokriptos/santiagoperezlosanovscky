<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Games visual calibration preview</title>
<style>html,body{margin:0;padding:0}iframe{display:block;border:0}</style>
<iframe title="Portfolio viewport preview"></iframe>
<script>
  const size = new URLSearchParams(location.search).get('viewport');
  const [width,height] = ({mobile:[390,844],tablet:[768,1024]})[size] || [1434,913];
  const frame=document.querySelector('iframe');
  frame.width=width; frame.height=height;
  frame.title=`${width} by ${height} portfolio preview`;
  // Preview-only fitting keeps the production iframe at its actual test dimensions.
  if(new URLSearchParams(location.search).has('fit')) {
    frame.style.transformOrigin='top left';
    frame.style.transform=`scale(${Math.min(1,innerWidth/width,innerHeight/height)})`;
    document.body.style.overflow='hidden';
  }
  function showRoute() {
    frame.src='../'+(new URLSearchParams(location.search).get('view') === 'root' ? '' : (location.hash || '#games'));
  }
  window.addEventListener('hashchange', showRoute);
  showRoute();
</script>
</html>
