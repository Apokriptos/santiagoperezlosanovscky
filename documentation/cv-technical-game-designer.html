<main data-source-sha256="8a6c45177929ce0a74bab9df271d4ea6624d1330a1fcecc7d418d0509dd95ff9" data-page-count="2"><section class="document-page" aria-label="CV page 1 of 2"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 595.303937007874 841.889763779528"><image href="cv-preview-page-1.png" width="595.303937007874" height="841.889763779528" aria-hidden="true"/><g fill="transparent" font-family="Arial, sans-serif"><text x="49.050" y="55.374" font-size="18.500" textLength="312.225" lengthAdjust="spacingAndGlyphs">SANTIAGO PÉREZ LOSANOVSCKY</text><text x="49.050" y="72.995" font-size="9.500" textLength="325.869" lengthAdjust="spacingAndGlyphs">GAME &amp; SYSTEMS DESIGNER | LEVEL DESIGNER | UNREAL ENGINE</text><text x="49.050" y="88.014" font-size="8.500" textLength="437.971" lengthAdjust="spacingAndGlyphs">Buenos Aires, Argentina • santiagolovsky@gmail.com • linkedin.com/in/santiago-perez-losanovscky-a91877172</text><text x="49.050" y="111.676" font-size="10.500" textLength="139.902" lengthAdjust="spacingAndGlyphs">PROFESSIONAL SUMMARY</text><text x="49.050" y="128.280" font-size="9.000" textLength="466.830" lengthAdjust="spacingAndGlyphs">Game and systems designer with 7+ years of experience across gameplay, systems and level design, mobile and VR</text><text x="49.050" y="139.830" font-size="9.000" textLength="470.673" lengthAdjust="spacingAndGlyphs">production, product ownership, and design leadership. Hands-on in Unreal Engine and Blueprints across investigation,</text><text x="49.050" y="151.380" font-size="9.000" textLength="491.589" lengthAdjust="spacingAndGlyphs">combat, AI, player interactions, level scripting, UI and data-driven content. Translate ambiguous creative goals into playable</text><text x="49.050" y="162.930" font-size="9.000" textLength="283.023" lengthAdjust="spacingAndGlyphs">systems, clear documentation and practical multidisciplinary workflows.</text><text x="49.050" y="186.926" font-size="10.500" textLength="70.508" lengthAdjust="spacingAndGlyphs">CORE SKILLS</text><text x="49.050" y="203.530" font-size="9.000" textLength="479.952" lengthAdjust="spacingAndGlyphs">Game Design • Systems Design • Level Design • Technical Design • Narrative &amp; Environmental Design • Unreal Engine •</text><text x="49.050" y="215.080" font-size="9.000" textLength="457.344" lengthAdjust="spacingAndGlyphs">Blueprints • Unity • Gameplay Prototyping • AI / Behavior Trees / Navigation • Level Implementation • UI / Widgets •</text><text x="49.050" y="226.630" font-size="9.000" textLength="136.629" lengthAdjust="spacingAndGlyphs">Documentation • Playtesting &amp; QA</text><text x="49.050" y="250.626" font-size="10.500" textLength="115.416" lengthAdjust="spacingAndGlyphs">SELECTED PROJECTS</text><text x="49.050" y="269.230" font-size="9.000" textLength="324.828" lengthAdjust="spacingAndGlyphs">Hollow Graves — Independent Unreal Engine Horror Project | 2025–Present</text><text x="51.250" y="282.780" font-size="9.000" textLength="480.220" lengthAdjust="spacingAndGlyphs">• Lead creative direction, game/systems and level design, investigation and clue systems, narrative/worldbuilding, UI/UX,</text><text x="59.150" y="294.330" font-size="9.000" textLength="326.124" lengthAdjust="spacingAndGlyphs">AI/gameplay logic, Blueprint architecture, documentation and production planning.</text><text x="51.250" y="306.880" font-size="9.000" textLength="459.745" lengthAdjust="spacingAndGlyphs">• Build systemic exploration and investigation directly in UE: data-driven clues, player knowledge/progression, focus</text><text x="59.150" y="318.430" font-size="9.000" textLength="435.060" lengthAdjust="spacingAndGlyphs">interactions, gameplay UI and a structured level-design workflow from design criteria to greybox and iteration.</text><text x="49.050" y="335.980" font-size="9.000" textLength="389.878" lengthAdjust="spacingAndGlyphs">Reditus Umbrae — Unreal Engine Dark-Fantasy Action Roguelite Prototype | 2026–Present</text><text x="51.250" y="349.530" font-size="9.000" textLength="482.389" lengthAdjust="spacingAndGlyphs">• Lead hands-on game/systems design and development for a collaborative action roguelite, spanning combat, encounter</text><text x="59.150" y="361.080" font-size="9.000" textLength="414.207" lengthAdjust="spacingAndGlyphs">and arena flow, enemy behaviors, progression/upgrades, animation integration and production planning.</text><text x="51.250" y="373.630" font-size="9.000" textLength="473.272" lengthAdjust="spacingAndGlyphs">• Built a playable top-down combat prototype with melee combos, charged heavy attacks, ranged attacks, dash, enemy</text><text x="59.150" y="385.180" font-size="9.000" textLength="380.601" lengthAdjust="spacingAndGlyphs">archetypes/AI, wave and room flow, XP/level-ups, configurable upgrades and combat feedback.</text><text x="49.050" y="402.730" font-size="9.000" textLength="311.828" lengthAdjust="spacingAndGlyphs">Dreadwoods — Unreal Engine Folkloric Horror Prototype | 2026–Present</text><text x="51.250" y="416.280" font-size="9.000" textLength="486.313" lengthAdjust="spacingAndGlyphs">• Design and implement exploration- and narrative-driven folklore horror centered on interactive sequences, environmental</text><text x="59.150" y="427.830" font-size="9.000" textLength="354.636" lengthAdjust="spacingAndGlyphs">storytelling, supernatural encounters and player powers rather than conventional combat.</text><text x="51.250" y="440.380" font-size="9.000" textLength="461.347" lengthAdjust="spacingAndGlyphs">• Integrate Unreal Sequencer with Blueprint dialogue and gameplay logic for branching/looping sequence segments,</text><text x="59.150" y="451.930" font-size="9.000" textLength="424.593" lengthAdjust="spacingAndGlyphs">gameplay-triggered events, slow-motion interactions and Witch, Beast and Luz Mala prototype encounters.</text><text x="49.050" y="469.480" font-size="9.000" textLength="340.828" lengthAdjust="spacingAndGlyphs">Drill to the Rend — Independent Unreal Engine FPS / Survivor Prototype | 2025</text><text x="51.250" y="483.030" font-size="9.000" textLength="468.772" lengthAdjust="spacingAndGlyphs">• Designed and built a solo playable prototype with adaptive enemies, Behavior Tree AI/navigation, weapon switching,</text><text x="59.150" y="494.580" font-size="9.000" textLength="339.606" lengthAdjust="spacingAndGlyphs">elemental combat, spawning/waves, progression/upgrades, UI and a boss encounter.</text><text x="51.250" y="507.130" font-size="9.000" textLength="464.308" lengthAdjust="spacingAndGlyphs">• Structured enemy defenses and elemental counters for readable tactical decisions, modular encounter variants and</text><text x="59.150" y="518.680" font-size="9.000" textLength="67.968" lengthAdjust="spacingAndGlyphs">efficient iteration.</text><text x="49.050" y="542.676" font-size="10.500" textLength="153.279" lengthAdjust="spacingAndGlyphs">PROFESSIONAL EXPERIENCE</text><text x="49.050" y="561.280" font-size="9.000" textLength="351.887" lengthAdjust="spacingAndGlyphs">Aconcagua Games — Product Owner / Lead Game Designer | May 2022–Sep 2024</text><text x="51.250" y="574.830" font-size="9.000" textLength="481.318" lengthAdjust="spacingAndGlyphs">• Led design and product ownership across multiple mobile projects, including released Fulbo Galaxy; owned mechanics,</text><text x="59.150" y="586.380" font-size="9.000" textLength="288.999" lengthAdjust="spacingAndGlyphs">progression, statistics, balancing, tutorials, level structures, and rewards.</text><text x="51.250" y="598.930" font-size="9.000" textLength="481.858" lengthAdjust="spacingAndGlyphs">• Designed and balanced levels, defined representative content and guidelines, and led a small Game/Level Design team</text><text x="59.150" y="610.480" font-size="9.000" textLength="199.557" lengthAdjust="spacingAndGlyphs">through implementation review and client delivery.</text><text x="51.250" y="623.030" font-size="9.000" textLength="488.779" lengthAdjust="spacingAndGlyphs">• Produced GDDs, feature specifications, UX/UI references and balance sheets; worked hands-on in Unity and coordinated</text><text x="59.150" y="634.580" font-size="9.000" textLength="259.020" lengthAdjust="spacingAndGlyphs">programming, art, QA and production across concurrent projects.</text><text x="49.050" y="652.130" font-size="9.000" textLength="341.430" lengthAdjust="spacingAndGlyphs">Pixowl — Match Island — Game Designer / Level Designer | Sep 2020–Jan 2022</text><text x="51.250" y="665.680" font-size="9.000" textLength="474.343" lengthAdjust="spacingAndGlyphs">• Designed and balanced mobile Match-3 levels, mechanics, progression and tutorials; developed high-volume content-</text><text x="59.150" y="677.230" font-size="9.000" textLength="228.582" lengthAdjust="spacingAndGlyphs">production language, standards and validation workflows.</text><text x="51.250" y="689.780" font-size="9.000" textLength="493.828" lengthAdjust="spacingAndGlyphs">• Coordinated external providers and supported up to three level designers through briefs, reviews, validation and balancing.</text><text x="51.250" y="702.330" font-size="9.000" textLength="489.220" lengthAdjust="spacingAndGlyphs">• Built and reviewed content in Unity and proprietary tools, using player-testing data to iterate difficulty and progression with</text><text x="59.150" y="713.880" font-size="9.000" textLength="103.968" lengthAdjust="spacingAndGlyphs">programming, art and QA.</text><text x="49.050" y="731.430" font-size="9.000" textLength="267.366" lengthAdjust="spacingAndGlyphs">Image Campus — Professor, Game Design | Apr 2022–Present</text><text x="51.250" y="744.980" font-size="9.000" textLength="492.253" lengthAdjust="spacingAndGlyphs">• Design and teach Game Design, Systems Design, Level Design, Unreal Engine Blueprints and Game Prototyping; created</text><text x="59.150" y="756.530" font-size="9.000" textLength="313.641" lengthAdjust="spacingAndGlyphs">an Unreal Prototyping Laboratory that expanded into a year-long learning path.</text><text x="51.250" y="769.080" font-size="9.000" textLength="474.658" lengthAdjust="spacingAndGlyphs">• Teach Blueprint scripting, gameplay systems, Behavior Trees/navigation, Animation Blueprints, UI/widgets, interfaces,</text><text x="59.150" y="780.630" font-size="9.000" textLength="141.012" lengthAdjust="spacingAndGlyphs">materials and level implementation.</text><text x="51.250" y="793.180" font-size="9.000" textLength="486.772" lengthAdjust="spacingAndGlyphs">• Mentor students through concept, scope, iteration, documentation, playable prototypes/MVPs and early career decisions.</text><text x="430.200" y="824.118" font-size="7.000" textLength="116.151" lengthAdjust="spacingAndGlyphs">SANTIAGO PÉREZ LOSANOVSCKY</text></g></svg></section><section class="document-page" aria-label="CV page 2 of 2"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 595.303937007874 841.889763779528"><image href="cv-preview-page-2.png" width="595.303937007874" height="841.889763779528" aria-hidden="true"/><g fill="transparent" font-family="Arial, sans-serif"><text x="49.050" y="46.180" font-size="9.000" textLength="388.873" lengthAdjust="spacingAndGlyphs">Aobscura Games (formerly Fin Del Mundo Games) — Creative Director | Nov 2021–Present</text><text x="51.250" y="59.730" font-size="9.000" textLength="478.330" lengthAdjust="spacingAndGlyphs">• Lead original independent game development from concept through prototype across creative direction, game/systems</text><text x="59.150" y="71.280" font-size="9.000" textLength="264.600" lengthAdjust="spacingAndGlyphs">and level design, narrative, production and Unreal implementation.</text><text x="51.250" y="83.830" font-size="9.000" textLength="481.741" lengthAdjust="spacingAndGlyphs">• Have directed multidisciplinary collaborations of approximately sixteen contributors across design, art and development;</text><text x="59.150" y="95.380" font-size="9.000" textLength="198.477" lengthAdjust="spacingAndGlyphs">mentor juniors, define workflows and review work.</text><text x="49.050" y="112.930" font-size="9.000" textLength="285.828" lengthAdjust="spacingAndGlyphs">VR Health — Lead Game Designer (Pro Bono) | Oct 2020–Jun 2021</text><text x="51.250" y="126.480" font-size="9.000" textLength="479.230" lengthAdjust="spacingAndGlyphs">• Led the redesign of a therapeutic VR initiative with Hospital Italiano de Buenos Aires, translating therapist requirements</text><text x="59.150" y="138.030" font-size="9.000" textLength="206.568" lengthAdjust="spacingAndGlyphs">into gameplay, narrative and level-design decisions.</text><text x="51.250" y="150.580" font-size="9.000" textLength="462.220" lengthAdjust="spacingAndGlyphs">• Served as primary designer/documentation lead, working around accessibility, patient-specific constraints, comfort,</text><text x="59.150" y="162.130" font-size="9.000" textLength="200.565" lengthAdjust="spacingAndGlyphs">cognitive/motor demands and specialist validation.</text><text x="49.050" y="179.680" font-size="9.000" textLength="419.430" lengthAdjust="spacingAndGlyphs">Independent Game Studio — Lead Game Designer / Producer / ScrumMaster | Jan 2019–Sep 2020</text><text x="51.250" y="193.230" font-size="9.000" textLength="479.815" lengthAdjust="spacingAndGlyphs">• Co-founded a six-person Unreal Engine PC project, leading design, documentation and early in-engine level work while</text><text x="59.150" y="204.780" font-size="9.000" textLength="227.547" lengthAdjust="spacingAndGlyphs">managing backlog, milestones, scope and sprint reviews.</text><text x="49.050" y="222.330" font-size="9.000" textLength="228.831" lengthAdjust="spacingAndGlyphs">COTO CICSA — Game Designer | Apr 2019–Nov 2019</text><text x="51.250" y="235.880" font-size="9.000" textLength="474.217" lengthAdjust="spacingAndGlyphs">• Designed gameplay and levels and performed QA for a multiplayer children’s VR project in Unity on Oculus hardware.</text><text x="49.050" y="253.430" font-size="9.000" textLength="202.778" lengthAdjust="spacingAndGlyphs">Independent — Author &amp; Writer | 2009–Present</text><text x="51.250" y="266.980" font-size="9.000" textLength="455.803" lengthAdjust="spacingAndGlyphs">• Write and independently publish original fiction focused on horror, worldbuilding, narrative structure, dialogue and</text><text x="59.150" y="278.530" font-size="9.000" textLength="312.066" lengthAdjust="spacingAndGlyphs">characters; apply these skills to game narrative and environmental storytelling.</text><text x="49.050" y="302.526" font-size="10.500" textLength="126.473" lengthAdjust="spacingAndGlyphs">EDUCATION &amp; TRAINING</text><text x="49.050" y="319.130" font-size="9.000" textLength="388.395" lengthAdjust="spacingAndGlyphs">Tecnicatura Superior en Animación 3D para Videojuegos — Image Campus | Mar 2025–Present</text><text x="49.050" y="332.680" font-size="9.000" textLength="326.322" lengthAdjust="spacingAndGlyphs">Experto Universitario en Programación con Unreal — UTN FRBA | Feb–Jul 2025</text><text x="49.050" y="346.230" font-size="9.000" textLength="172.350" lengthAdjust="spacingAndGlyphs">ScrumMaster — Liqueed | May–Aug 2024</text><text x="49.050" y="359.780" font-size="9.000" textLength="375.345" lengthAdjust="spacingAndGlyphs">INMERSIVAS: VR Interaction Design with Unreal Engine — Image Campus | 2020–Jan 2021</text><text x="49.050" y="373.330" font-size="9.000" textLength="212.337" lengthAdjust="spacingAndGlyphs">Trayecto de Game Design — Image Campus | 2018</text><text x="49.050" y="397.326" font-size="10.500" textLength="116.571" lengthAdjust="spacingAndGlyphs">TOOLS &amp; LANGUAGES</text><text x="49.050" y="413.930" font-size="9.000" textLength="494.199" lengthAdjust="spacingAndGlyphs">Unreal Engine • Blueprints • Unity • C++ (prototype-level) • Behavior Trees • Navigation • Animation Blueprints • Sequencer •</text><text x="49.050" y="425.480" font-size="9.000" textLength="487.755" lengthAdjust="spacingAndGlyphs">Control Rig • UI/Widgets • Materials • Sheets • Miro • Figma • Trello • ClickUp • Slack • Scrum/Agile • Maya • After Effects |</text><text x="49.050" y="437.030" font-size="9.000" textLength="96.516" lengthAdjust="spacingAndGlyphs">English: Native/Bilingual</text><text x="430.200" y="824.118" font-size="7.000" textLength="116.151" lengthAdjust="spacingAndGlyphs">SANTIAGO PÉREZ LOSANOVSCKY</text></g></svg></section></main></html>
